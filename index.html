<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>Roulette Tracker Pro All in one</title>
    <link rel="stylesheet" href="/index.css">
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background-color: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .loader {
        width: 44px;
        height: 44px;
        border: 3px solid #FFD700;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 0.8s linear infinite;
      }
      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .splash-text {
        margin-top: 18px;
        color: #FFD700;
        font-family: 'Playfair Display', serif;
        font-size: 1.15rem;
        font-weight: bold;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(e) {
        if (e && (e.message === 'Script error.' || e.message?.includes('Script error'))) {
          console.warn('Captured external script error:', e);
          if (typeof e.preventDefault === 'function') e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && e.reason.message === 'Script error.') {
          if (typeof e.preventDefault === 'function') e.preventDefault();
        }
      });
    </script>
</head>
  <body class="bg-black text-gray-100 transition-colors duration-300 overscroll-none h-screen-ios">
    <div id="splash">
      <div class="loader"></div>
      <div class="splash-text">Roulette Tracker Pro All in one</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      (function() {
        function removeSplash() {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => { try { splash.remove(); } catch(e){} }, 300);
          }
        }
        if (document.readyState === 'complete') {
          setTimeout(removeSplash, 100);
        } else {
          window.addEventListener('load', removeSplash);
          setTimeout(removeSplash, 500);
        }
      })();
    </script>
  </body>
</html>
